<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelVault | Download Free PC & Mobile Games</title>
    <style>
        /* Base Reset & Colors */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1d2e;
            --accent-color: #00ff87;
            --text-color: #ffffff;
            --text-muted: #8b949e;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Navigation Header */
        header {
            background-color: rgba(26, 29, 46, 0.95);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid #252943;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
            letter-spacing: 1px;
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            margin-left: 1.5rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        /* Hero Showcase Section */
        .hero {
            padding: 4rem 5%;
            text-align: center;
            background: linear-gradient(180deg, #16192b 0%, var(--bg-color) 100%);
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .hero h1 span {
            color: var(--accent-color);
        }

        .hero p {
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 2rem auto;
        }

        /* Search Bar */
        .search-container {
            max-width: 500px;
            margin: 0 auto;
        }

        .search-bar {
            width: 100%;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            border: 2px solid #252943;
            background-color: var(--card-bg);
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .search-bar:focus {
            border-color: var(--accent-color);
        }

        /* Game Catalog Grid */
        .catalog-title {
            padding: 2rem 5% 0 5%;
            font-size: 1.8rem;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            padding: 2rem 5% 4rem 5%;
        }

        /* Individual Game Card Component */
        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #252943;
            transition: transform 0.3s, border-color 0.3s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .game-thumbnail {
            width: 100%;
            height: 180px;
            background-color: #2c304d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-weight: bold;
            position: relative;
        }

        .game-info {
            padding: 1.5rem;
        }

        .game-tags {
            font-size: 0.8rem;
            color: var(--accent-color);
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .game-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .game-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            height: 40px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Download Call-to-Action */
        .download-btn {
            display: block;
            width: 100%;
            padding: 0.8rem;
            background-color: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            border-radius: 6px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .download-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(0, 255, 135, 0.4);
        }

        /* Footer */
        footer {
            background-color: #0b0c13;
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            border-top: 1px solid #252943;
            font-size: 0.9rem;
        }

        /* Responsive Breakpoints */
        @media (max-width: 600px) {
            .hero h1 { font-size: 2rem; }
            header { flex-direction: column; gap: 1rem; }
            nav a { margin: 0 0.5rem; }
        }
    </style>
</head>

    <!-- Interactive Search Logic -->
    <script>
        const searchInput = document.getElementById('search');
        const cards = document.querySelectorAll('.game-card');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            
            cards.forEach(card => {
                const title = card.getAttribute('data-title');
                if (title.includes(query)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    </script>
